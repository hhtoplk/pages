<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>XML URL Generator</title>
</head>
<body>
<h2>XML URL Generator</h2>

<label>XML URL:</label><br>
<input id="xmlUrl" value="https://hhtoplk.github.io/pages/tour/m.xml" style="width:90%"><br><br>

<label>ID:</label><br>
<input id="videoId" value="video-man-city-v-psg-match-lie-yvackqi" style="width:90%"><br><br>

<button onclick="generate()">Generate URL</button><br><br>
<textarea id="result" rows="5" style="width:90%"></textarea><br><br>
<button onclick="copyUrl()">Copy URL</button>

<script>
function generate() {
  const xmlUrl = document.getElementById("xmlUrl").value.trim();
  const id = document.getElementById("videoId").value.trim();

  const payload = '<krpano><include url="' +
    xmlUrl.replace(/&/g, '&amp;') +
    '"/></krpano>';

  const base64 = btoa(unescape(encodeURIComponent(payload)));

  document.getElementById("result").value =
    '&xml=data:video/mp4;base64,' + base64 +
    '&id=' + encodeURIComponent(id);
}

function copyUrl() {
  const result = document.getElementById("result");
  result.select();
  document.execCommand("copy");
}
</script>
</body>
</html>
