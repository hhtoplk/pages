
<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>HTML File Loader</title>
  <style>
    body {
      font-family: Arial, sans-serif;
      margin: 30px;
      overflow-wrap: anywhere;
    }
  </style>
</head>
<body>
  <p id="status">Loading HTML file...</p>

  <script>
    const params = new URLSearchParams(window.location.search);
    const id = params.get("id");

    const apiURL =
      "https://api.github.com/repos/hhtoplk/pages/contents/tour/html-filse";

    async function loadHTML() {
      const status = document.getElementById("status");

      if (!id || !/^[a-zA-Z0-9_-]+$/.test(id)) {
        status.textContent = "Please provide a valid HTML file ID in the URL.";
        return;
      }

      try {
        const response = await fetch(apiURL);

        if (!response.ok) {
          throw new Error("Could not retrieve the folder file list.");
        }

        const files = await response.json();

        const match = files.find(file =>
          file.type === "file" &&
          file.name.toLowerCase() === (id + ".html").toLowerCase()
        );

        if (!match) {
          throw new Error("No matching HTML file was found.");
        }

        const pageURL =
          "./" + encodeURIComponent(match.name);

        const pageResponse = await fetch(pageURL);

        if (!pageResponse.ok) {
          throw new Error("Could not load the HTML file.");
        }

        const html = await pageResponse.text();

        document.open();
        document.write(html);
        document.close();

      } catch (error) {
        status.textContent = error.message;
      }
    }

    loadHTML();
  </script>
</body>
</html>
