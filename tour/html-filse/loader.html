<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>HTML File Loader</title>
</head>
<body>
  <p id="status">Loading HTML file...</p>

  <script>
    const id = new URLSearchParams(location.search).get("id");
    const status = document.getElementById("status");

    if (!id || !/^[a-zA-Z0-9_-]+$/.test(id)) {
      status.textContent = "Valid ID required.";
    } else {
      fetch("./" + encodeURIComponent(id) + ".html")
        .then(response => {
          if (!response.ok) throw new Error("HTML file not found.");
          return response.text();
        })
        .then(html => {
          document.open();
          document.write(html);
          document.close();
        })
        .catch(error => {
          status.textContent = error.message;
        });
    }
  </script>
</body>
</html>
